name: forecast

# Manual-only now. analysis/baseline.py used to run here on a `schedule`
# trigger every 30 min, offset off :00/:30 to dodge GitHub's shared-runner
# load spikes — but that only ever reduced, not fixed, the problem:
# GitHub's `schedule` trigger is best-effort and was actually silently
# dropping most ticks regardless of offset (checked the real run history:
# runs meant to land 30 min apart were landing anywhere from 3 to 8 hours
# apart). The job now runs inside worker/ingest.py's own 30-min internal
# timer instead — see that file's module docstring — since that worker is
# already paid-for and already running continuously for MQTT, so it isn't
# at the mercy of an external scheduler. This workflow is kept only for
# `workflow_dispatch` — a manual "Run workflow" button, handy for testing
# baseline.py against the real database without waiting for the worker's
# own timer.

on:
  workflow_dispatch: {}          # manual "Run workflow" button

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - run: pip install -r analysis/requirements.txt
      - run: python analysis/baseline.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # unset -> baseline.py processes every device in aqua_devices
