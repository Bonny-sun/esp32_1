name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  firmware:
    name: firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      # secrets.h is gitignored; the example file has placeholder values and
      # is enough for the compiler.
      - run: cp include/secrets.h.example include/secrets.h
      - run: pio run
