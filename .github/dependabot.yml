version: 2
updates:
  # GitHub Actions used in .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Python dependencies — one entry per directory with its own requirements*.txt,
  # since Dependabot's pip ecosystem doesn't scan recursively.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/worker"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/analysis"
    schedule:
      interval: "weekly"
