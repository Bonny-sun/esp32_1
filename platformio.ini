; ============================================================================
;  Smart Aquaponics Edge Monitor  —  Phase 1 (MVP: DHT + OLED + RGB LED)
;  Target : ESP32-WROOM-32 DevKit (38-pin) on expansion board
;  Toolchain: PlatformIO + Arduino framework (C++)
; ============================================================================

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform  = espressif32@6.9.0        ; arduino-esp32 2.0.17 (stable, ledcSetup API)
board     = esp32dev
framework = arduino

monitor_speed  = 115200
upload_speed   = 921600
monitor_filters = esp32_exception_decoder, time

; --- Library dependencies (pinned) ------------------------------------------
lib_deps =
    olikraus/U8g2 @ ^2.35.30                      ; OLED SSD1306 + XBM/bitmaps + fonts
    adafruit/DHT sensor library @ ^1.4.6          ; DHT11 / DHT22
    adafruit/Adafruit Unified Sensor @ ^1.1.14    ; dependency of DHT lib
    knolleary/PubSubClient @ ^2.8                 ; MQTT client
    bblanchon/ArduinoJson @ ^7.2.0               ; JSON telemetry payload
    https://github.com/tzapu/WiFiManager.git#v2.0.17  ; captive-portal Wi-Fi + MQTT provisioning

; WiFiManager pulls in a web server -> use a roomier app partition (keeps
; headroom for OTA later). NVS stays at the same offset, so saved config survives.
board_build.partitions = min_spiffs.csv

; --- Build flags -----------------------------------------------------------
build_flags =
    -DCORE_DEBUG_LEVEL=2
    ; PubSubClient default buffer is 256 B; we also raise it at runtime with
    ; mqtt.setBufferSize(512) so future JSON fields (water_temp, ph, ...) fit.
    -DMQTT_MAX_PACKET_SIZE=512

; Secrets: copy include/secrets.h.example -> include/secrets.h (gitignored)
; and fill in Wi-Fi + HiveMQ Cloud credentials.
